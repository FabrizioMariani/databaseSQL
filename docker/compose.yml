services:
  postgres:
    image: postgres:16
    container_name: oliver-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: olist
    ports:
      - "5432:5432"
    volumes:
      - olist_data:/var/lib/postgresql/data

volumes:
  olist_data:
  